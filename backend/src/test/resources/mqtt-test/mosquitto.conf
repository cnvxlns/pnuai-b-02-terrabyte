# Test-only broker config for MqttTelemetryIngestionIntegrationTests.
#
# Anonymous access is deliberately allowed here so the automated test suite
# does not need credentials wired through Testcontainers. This file is NOT
# the production broker config — that one lives under infra/mosquitto/ and
# intentionally forbids anonymous access. Do not point any real deployment
# at this file.
listener 1883
allow_anonymous true
