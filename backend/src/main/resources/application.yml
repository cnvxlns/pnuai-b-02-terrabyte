spring:
  application:
    name: terrabyte-backend
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:terrabyte-backend}
      secret: ${JWT_SECRET:terrabyte-local-development-secret-change-me-2026}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}
  datasource:
    postgres:
      url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/terrabyte}
      username: ${POSTGRES_USER:terrabyte}
      password: ${POSTGRES_PASSWORD:terrabyte}
      driver-class-name: org.postgresql.Driver
      configuration:
        maximum-pool-size: ${POSTGRES_POOL_SIZE:10}
    sqlite:
      url: ${SQLITE_URL:jdbc:sqlite:./db/terrabyte-score.db}
      driver-class-name: org.sqlite.JDBC
      configuration:
        maximum-pool-size: ${SQLITE_POOL_SIZE:2}
  influx:
    url: ${INFLUX_URL:http://localhost:8086}
    token: ${INFLUX_TOKEN:terrabyte-local-token}
    org: ${INFLUX_ORG:terrabyte}
    bucket: ${INFLUX_BUCKET:telemetry}
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    url: ${MQTT_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:terrabyte-backend}
    username: ${MQTT_USERNAME:terrabyte-backend}
    password: ${MQTT_PASSWORD:terrabyte-backend-local}
    topic-prefix: ${MQTT_TOPIC_PREFIX:tb/v2}
    connection-timeout: ${MQTT_CONNECTION_TIMEOUT:PT10S}
    keep-alive: ${MQTT_KEEP_ALIVE:PT30S}
    clean-session: ${MQTT_CLEAN_SESSION:false}
  telemetry:
    http-ingest:
      enabled: ${TELEMETRY_HTTP_INGEST_ENABLED:false}
