spring:
  application:
    name: terrabyte-backend
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  admin:
    api-key: ${ADMIN_API_KEY:}
  security:
    jwt:
      issuer: ${JWT_ISSUER:terrabyte-backend}
      secret: ${JWT_SECRET:terrabyte-local-development-secret-change-me-2026}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}
  datasource:
    postgres:
      url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/terrabyte}
      username: ${POSTGRES_USER:terrabyte}
      password: ${POSTGRES_PASSWORD:terrabyte}
      driver-class-name: org.postgresql.Driver
      configuration:
        maximum-pool-size: ${POSTGRES_POOL_SIZE:10}
    sqlite:
      url: ${SQLITE_URL:jdbc:sqlite:./db/terrabyte-score.db}
      driver-class-name: org.sqlite.JDBC
      configuration:
        maximum-pool-size: ${SQLITE_POOL_SIZE:2}
  influx:
    url: ${INFLUX_URL:http://localhost:8086}
    token: ${INFLUX_TOKEN:terrabyte-local-token}
    org: ${INFLUX_ORG:terrabyte}
    bucket: ${INFLUX_BUCKET:telemetry}
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    url: ${MQTT_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:terrabyte-backend}
    username: ${MQTT_USERNAME:terrabyte-backend}
    password: ${MQTT_PASSWORD:terrabyte-backend-local}
    topic-prefix: ${MQTT_TOPIC_PREFIX:tb/v2}
    connection-timeout: ${MQTT_CONNECTION_TIMEOUT:PT10S}
    keep-alive: ${MQTT_KEEP_ALIVE:PT30S}
    clean-session: ${MQTT_CLEAN_SESSION:false}
    publish-timeout: ${MQTT_PUBLISH_TIMEOUT:PT5S}
    command-dispatch:
      # Off until the end-to-end scenarios have run. Turning this on is what
      # starts moving water: the backend stops recording authorised commands and
      # starts publishing them to tb/v2/{gatewayId}/dn/command.
      enabled: ${MQTT_COMMAND_DISPATCH_ENABLED:false}
    heartbeat:
      # Proof that the application is alive, not merely the broker. Off only
      # for a deployment that has no gateways. Also needs app.scheduling.enabled.
      enabled: ${MQTT_HEARTBEAT_ENABLED:true}
      interval-ms: ${MQTT_HEARTBEAT_INTERVAL_MS:30000}
      initial-delay-ms: ${MQTT_HEARTBEAT_INITIAL_DELAY_MS:10000}
  scheduling:
    # The single switch for background timers: the expiry sweep and the liveness
    # heartbeat. @EnableScheduling activates every @Scheduled method in the
    # context, so it is a process-wide capability rather than a feature flag.
    # Only the test profile turns it off.
    enabled: ${SCHEDULING_ENABLED:true}
  irrigation:
    sweep:
      # Cadence only. Without the sweep a lost acknowledgement holds a pot's
      # in-flight gate open forever, so there is no switch to turn it off
      # independently of app.scheduling.
      interval-ms: ${IRRIGATION_SWEEP_INTERVAL_MS:30000}
      initial-delay-ms: ${IRRIGATION_SWEEP_INITIAL_DELAY_MS:10000}
  rule:
    # 주기 평가. fixedDelay 라 느린 패스 뒤에 다음 패스가 쌓이지 않는다.
    interval-ms: ${RULE_INTERVAL_MS:60000}
    initial-delay-ms: ${RULE_INITIAL_DELAY_MS:20000}
    # 이 아래로 내려가면 Governor 에게 물을 요청한다. 엣지의 자율 임계(15%)보다
    # 훨씬 높은데, 이쪽은 뒤에 Governor 가 있어 간격과 예산으로 거절할 수
    # 있으므로 일찍 물어봐도 된다. 긴급 규칙은 확인해 줄 주체가 없어 그럴 수 없다.
    soil-dry-gate-pct: ${RULE_SOIL_DRY_GATE_PCT:35.0}
    # 조명이 켜질 수 있는 시간대. 식물에는 빛만큼 어둠도 필요하다.
    photoperiod-start: ${RULE_PHOTOPERIOD_START:06:00}
    photoperiod-end: ${RULE_PHOTOPERIOD_END:22:00}
    # 작물별 PPFD 최적 구간에 곱하는 배수. 구간이 곧 히스테리시스다.
    light-band-margin: ${RULE_LIGHT_BAND_MARGIN:1.0}
  telemetry:
    http-ingest:
      enabled: ${TELEMETRY_HTTP_INGEST_ENABLED:false}
  notification:
    sensor-reminder-interval: ${NOTIFICATION_SENSOR_REMINDER_INTERVAL:PT1H}
    offline-reminder-interval: ${NOTIFICATION_OFFLINE_REMINDER_INTERVAL:PT6H}
    delivery:
      poll-delay-ms: ${NOTIFICATION_DELIVERY_POLL_DELAY_MS:5000}
      batch-size: ${NOTIFICATION_DELIVERY_BATCH_SIZE:50}
      max-attempts: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:5}
      retry-interval: ${NOTIFICATION_DELIVERY_RETRY_INTERVAL:PT30S}
      claim-timeout: ${NOTIFICATION_DELIVERY_CLAIM_TIMEOUT:PT5M}
    firebase:
      enabled: ${FIREBASE_ENABLED:false}
      project-id: ${FIREBASE_PROJECT_ID:}
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:http://localhost:8000}
    api-key: ${AI_API_KEY:}
    timeout: ${AI_TIMEOUT:PT0.8S}
    expected-schema-version: ${AI_EXPECTED_SCHEMA_VERSION:1}
    hard-ceiling-ml: ${AI_HARD_CEILING_ML:500}
    min-confidence: ${AI_MIN_CONFIDENCE:0.5}
    # Two unrelated services share this namespace. app.ai.* is the irrigation
    # volume regressor, which only suggests a number the Governor then
    # validates. app.ai.gemini.* is the advisory care-plan agent, which
    # produces text and touches no actuator. Separate @ConfigurationProperties
    # records (app.ai and app.ai.gemini) bind them, so neither sees the other's
    # keys - but they must live under ONE `ai:` mapping. SnakeYAML rejects a
    # duplicate mapping key outright, so a second `ai:` here does not merely
    # shadow the first: the whole application refuses to start. That failure is
    # what PR #120 was opened to fix.
    gemini:
      enabled: ${GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      cache-ttl: ${GEMINI_CACHE_TTL:PT30M}
  payment:
    toss:
      enabled: ${TOSS_PAYMENTS_ENABLED:false}
      base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
      client-key: ${TOSS_PAYMENTS_CLIENT_KEY:}
      secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
      success-url: ${TOSS_PAYMENTS_SUCCESS_URL:http://localhost:8081/payment/success}
      fail-url: ${TOSS_PAYMENTS_FAIL_URL:http://localhost:8081/payment/fail}
