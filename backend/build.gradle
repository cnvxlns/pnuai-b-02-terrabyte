plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.terrabyte'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'com.influxdb:influxdb-client-java:8.0.0'
	implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.xerial:sqlite-jdbc'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}



tasks.register('prepareSqliteResources', Copy) {
	from('db') {
		include '*.sql'
		include 'migrations/*.sql'
	}
	into layout.buildDirectory.dir('generated-resources/db/sqlite')
}

tasks.named('processResources') {
	dependsOn 'prepareSqliteResources'
}

sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated-resources')

tasks.named('test') {
	useJUnitPlatform()
}

// Docker 개발 컨테이너에서 원격 디버깅(JDWP) 등 JVM 옵션을 주입하기 위한 훅.
// 환경 변수가 없으면 아무 동작도 하지 않으므로 로컬 실행에는 영향이 없다.
tasks.named('bootRun') {
	String extraJvmArgs = System.getenv('BOOT_RUN_JVM_ARGS')
	if (extraJvmArgs != null && !extraJvmArgs.isBlank()) {
		jvmArgs(extraJvmArgs.trim().split('\\s+') as List)
	}
}
