# TerraByte 배포(프로덕션 유사) 스택
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   http://localhost:${WEB_PORT:-8088}
#
# 개발 스택(docker-compose.yml)과 달리 소스 bind mount 없이 이미지에 빌드된
# jar / 정적 번들만 실행합니다. 실제 배포 시에는 .env 의 자격 증명을 반드시 교체하세요.
name: terrabyte-prod

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terrabyte}
      POSTGRES_USER: ${POSTGRES_USER:-terrabyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 설정하세요}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-terrabyte}" -d "${POSTGRES_DB:-terrabyte}"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  influxdb:
    image: ${INFLUXDB_IMAGE:-influxdb:2.7}
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-terrabyte}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?INFLUX_PASSWORD 를 설정하세요}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-terrabyte}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?INFLUX_TOKEN 을 설정하세요}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    restart: unless-stopped

  mosquitto:
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2}
    ports:
      # 게이트웨이는 컨테이너 네트워크 밖 LAN 에 있으므로 브로커만은 공개한다.
      # 다른 서비스가 포트를 하나도 열지 않는 것과 대비되는 의도적 예외다.
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - ./infra/mosquitto/passwd:/mosquitto/config/passwd:ro
      # retained 메시지(특히 up/status 온라인 상태)와 로그가 재시작 후에도 남아야
      # 백엔드가 게이트웨이 프레즌스를 다시 계산하지 않아도 된다.
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      # 컨테이너가 떠 있는지가 아니라 브로커가 실제로 응답하는지 확인한다:
      # mosquitto_sub 로 구독을 시도해 접속·인증 경로가 살아있음을 증명한다.
      test:
        - CMD-SHELL
        - mosquitto_sub -h localhost -p 1883 -u terrabyte-backend -P "${MQTT_PASSWORD}" -t '$$SYS/#' -C 1 -W 3 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:21-jdk-jammy}
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:21-jre-jammy}
    image: terrabyte/backend:${IMAGE_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_started
      mosquitto:
        # MQTT 연결 없이는 게이트웨이 텔레메트리를 받을 수 없으므로 healthy 를 기다린다.
        condition: service_healthy
      ai-server:
        # AI 장애가 백엔드 장애가 되면 안 된다. service_healthy 금지.
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SERVER_PORT: "8080"
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-terrabyte}
      POSTGRES_USER: ${POSTGRES_USER:-terrabyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 설정하세요}
      SQLITE_URL: jdbc:sqlite:/app/data/terrabyte-score.db
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:?INFLUX_TOKEN 을 설정하세요}
      INFLUX_ORG: ${INFLUX_ORG:-terrabyte}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telemetry}
      TELEMETRY_DEVICE_KEY: ${TELEMETRY_DEVICE_KEY:?TELEMETRY_DEVICE_KEY 를 설정하세요}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_URL: ${MQTT_URL:-tcp://mosquitto:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-terrabyte-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD 를 설정하세요}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-tb/v2}
      # 이 스위치가 켜져야 백엔드가 승인한 관수를 실제로 발행한다. 꺼져 있으면
      # LoggingCommandDispatcher 가 경고만 남기고 명령은 TTL 로 만료된다.
      MQTT_COMMAND_DISPATCH_ENABLED: ${MQTT_COMMAND_DISPATCH_ENABLED:-false}
      # 시연용 임시 완화 스위치. 게이트 1(오래된 측정값으로는 관수하지 않는다)의
      # 기준을 밖에서 조절한다. 기본값은 코드와 같은 10분이다.
      APP_IRRIGATION_MAX_SAMPLE_AGE: ${IRRIGATION_MAX_SAMPLE_AGE:-PT10M}
      # 게이트 2(연속 관수 제한). 기본값은 코드와 같은 6시간이다. 시연에서
      # 반복 촬영이 필요할 때만 잠시 줄인다.
      APP_IRRIGATION_MIN_INTERVAL: ${IRRIGATION_MIN_INTERVAL:-PT6H}
      # 룰 엔진. 임계값을 밖에서 조절할 수 없으면 시연 중에 관수를 유도하려고
      # 이미지를 다시 빌드해야 한다. 기본값은 모두 코드와 같다.
      RULE_INTERVAL_MS: ${RULE_INTERVAL_MS:-60000}
      # 이 값 아래로 내려가면 Governor 에게 물을 요청한다. 요청일 뿐이며
      # 간격·예산·용량은 여전히 Governor 가 판단한다.
      RULE_SOIL_DRY_GATE_PCT: ${RULE_SOIL_DRY_GATE_PCT:-35.0}
      # 조명이 켜질 수 있는 시간대. 밖에서는 램프가 무조건 꺼진다.
      RULE_PHOTOPERIOD_START: ${RULE_PHOTOPERIOD_START:-06:00}
      RULE_PHOTOPERIOD_END: ${RULE_PHOTOPERIOD_END:-22:00}
      JWT_ISSUER: ${JWT_ISSUER:-terrabyte-backend}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 을 32바이트 이상으로 설정하세요}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT1H}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      NOTIFICATION_SENSOR_REMINDER_INTERVAL: ${NOTIFICATION_SENSOR_REMINDER_INTERVAL:-PT1H}
      NOTIFICATION_OFFLINE_REMINDER_INTERVAL: ${NOTIFICATION_OFFLINE_REMINDER_INTERVAL:-PT6H}
      NOTIFICATION_DELIVERY_POLL_DELAY_MS: ${NOTIFICATION_DELIVERY_POLL_DELAY_MS:-5000}
      NOTIFICATION_DELIVERY_BATCH_SIZE: ${NOTIFICATION_DELIVERY_BATCH_SIZE:-50}
      NOTIFICATION_DELIVERY_MAX_ATTEMPTS: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:-5}
      NOTIFICATION_DELIVERY_RETRY_INTERVAL: ${NOTIFICATION_DELIVERY_RETRY_INTERVAL:-PT30S}
      NOTIFICATION_DELIVERY_CLAIM_TIMEOUT: ${NOTIFICATION_DELIVERY_CLAIM_TIMEOUT:-PT5M}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai-server:8000}
      AI_API_KEY: ${AI_API_KEY:-}
      TOSS_PAYMENTS_ENABLED: ${TOSS_PAYMENTS_ENABLED:-false}
      TOSS_PAYMENTS_CLIENT_KEY: ${TOSS_PAYMENTS_CLIENT_KEY:-}
      TOSS_PAYMENTS_SECRET_KEY: ${TOSS_PAYMENTS_SECRET_KEY:-}
      TOSS_PAYMENTS_SUCCESS_URL: ${TOSS_PAYMENTS_SUCCESS_URL:-http://localhost:8088/payment/success}
      TOSS_PAYMENTS_FAIL_URL: ${TOSS_PAYMENTS_FAIL_URL:-http://localhost:8088/payment/fail}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_CACHE_TTL: ${GEMINI_CACHE_TTL:-PT30M}
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    image: terrabyte/ai-server:${IMAGE_TAG:-local}
    environment:
      TZ: ${TZ:-Asia/Seoul}
      AI_MODEL_PATH: ${AI_MODEL_PATH:-/app/models/irrigation_reg_v1.joblib}
      # 설정하면 X-Api-Key 검증이 켜진다. 호스트 포트를 열지 않으므로 기본은 무인증.
      AI_API_KEY: ${AI_API_KEY:-}
    # 호스트 포트를 공개하지 않는다. 백엔드만 내부 네트워크로 접근한다.
    restart: unless-stopped

  web:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
        # 빈 값 = 동일 출처(/api) 요청 → nginx 가 backend 로 프록시
        EXPO_PUBLIC_API_BASE_URL: ${PROD_API_BASE_URL-}
    image: terrabyte/web:${IMAGE_TAG:-local}
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  postgres-data:
  influxdb-data:
  influxdb-config:
  mosquitto-data:
  mosquitto-log:
  backend-data:
