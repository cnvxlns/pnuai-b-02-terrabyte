# TerraByte 개발용 Docker Compose 스택
#
#   docker compose up          # PostgreSQL + InfluxDB + Spring 백엔드 + Expo 프론트엔드
#   docker compose --profile storybook up storybook
#
# 자세한 사용법은 docs/docker_dev_environment.md 를 참고하세요.
name: terrabyte

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: terrabyte-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terrabyte}
      POSTGRES_USER: ${POSTGRES_USER:-terrabyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrabyte}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-terrabyte}" -d "${POSTGRES_DB:-terrabyte}"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  influxdb:
    image: ${INFLUXDB_IMAGE:-influxdb:2.7}
    container_name: terrabyte-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-terrabyte}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-terrabyte-admin-password}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-terrabyte}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-terrabyte-local-token}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${INFLUX_PORT:-8086}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: terrabyte-mosquitto
    # 원본 이미지의 엔트리포인트 대신 우리 스크립트를 쓴다. 이유는 두 가지:
    #  1) TLS 인증서가 있을 때만 8883 리스너를 켜는 graceful-degrade 로직
    #     (infra/mosquitto/generate-certs.sh 로 만들지 않으면 1883만 뜬다).
    #  2) 읽기 전용 마운트인 passwd/aclfile을 쓰기 가능한 경로로 복사해 0600으로
    #     권한을 좁힌다 — 그대로 두면 "world readable" 경고가 뜨고 향후
    #     mosquitto 버전은 로드 자체를 거부한다.
    # 자세한 내용은 infra/mosquitto/docker-entrypoint.sh 주석 참고.
    entrypoint: ["/bin/sh", "/docker-entrypoint-tb.sh"]
    ports:
      - "${MQTT_PORT:-1883}:1883"
      # TLS(8883) — 인증서가 없으면 mosquitto는 그냥 이 리스너 없이 뜬다(정상).
      # 게이트웨이를 TLS로 붙이려면 infra/mosquitto/generate-certs.sh 를 먼저 실행한다.
      - "${MQTT_TLS_PORT:-8883}:8883"
    volumes:
      # mosquitto.conf 는 이 컨테이너 전용 하위 경로(config-src)에서 직접 읽는다.
      # 여기 있는 파일은 :ro 이므로 컨테이너 안에서 고쳐 쓸 수 없다 — passwd/aclfile
      # 은 docker-entrypoint.sh 가 /mosquitto/config/runtime 으로 복사해서 쓴다.
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config-src/mosquitto.conf:ro
      - ./infra/mosquitto/aclfile:/mosquitto/config-src/aclfile:ro
      - ./infra/mosquitto/passwd:/mosquitto/config-src/passwd:ro
      - ./infra/mosquitto/tls.conf.template:/mosquitto/config-src/tls.conf.template:ro
      - ./infra/mosquitto/docker-entrypoint.sh:/docker-entrypoint-tb.sh:ro
      # generate-certs.sh 실행 전에는 비어 있다 — 그래도 마운트 자체는 문제없이 된다.
      - ./infra/mosquitto/certs:/mosquitto/certs:ro
      # passwd/aclfile 권한 좁히기 + TLS conf.d 조각을 담는 런타임 전용 볼륨.
      # 컨테이너를 새로 만들 때마다 docker-entrypoint.sh 가 다시 채운다.
      - mosquitto-runtime-config:/mosquitto/config/runtime
      # retained 메시지(특히 up/status 온라인 상태)와 로그가 재시작 후에도 남아야
      # 백엔드가 게이트웨이 프레즌스를 다시 계산하지 않아도 된다.
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      # 컨테이너가 떠 있는지가 아니라 브로커가 실제로 응답하는지 확인한다:
      # mosquitto_sub 로 1초간 구독을 시도해 접속·인증 경로가 살아있음을 증명한다.
      test:
        - CMD-SHELL
        - mosquitto_sub -h localhost -p 1883 -u terrabyte-backend -P "${MQTT_PASSWORD:-terrabyte-backend-local}" -t 'tb/v2/+/up/telemetry' -E || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      args:
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:21-jdk-jammy}
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    image: terrabyte/backend-dev
    container_name: terrabyte-backend
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        # 백엔드는 기동 시점에 Influx 가 필요하지 않으므로 healthy 까지 기다리지 않는다.
        condition: service_started
      mosquitto:
        # MQTT 연결 없이는 게이트웨이 텔레메트리를 받을 수 없으므로 healthy 를 기다린다.
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SERVER_PORT: "8080"
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-terrabyte}
      POSTGRES_USER: ${POSTGRES_USER:-terrabyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrabyte}
      SQLITE_URL: jdbc:sqlite:/workspace/backend/db/terrabyte-score.db
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:-terrabyte-local-token}
      INFLUX_ORG: ${INFLUX_ORG:-terrabyte}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telemetry}
      TELEMETRY_DEVICE_KEY: ${TELEMETRY_DEVICE_KEY:-terrabyte-local-device-key}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_URL: ${MQTT_URL:-tcp://mosquitto:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-terrabyte-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-terrabyte-backend-local}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-tb/v2}
      # HTTP 수집은 디버그·폴백 경로다. 브로커 ACL 같은 게이트웨이 인증이
      # 없으므로 기본은 비활성이고, curl 로 파이프라인을 훑을 때만 켠다.
      TELEMETRY_HTTP_INGEST_ENABLED: ${TELEMETRY_HTTP_INGEST_ENABLED:-false}
      JWT_ISSUER: ${JWT_ISSUER:-terrabyte-backend}
      JWT_SECRET: ${JWT_SECRET:-terrabyte-local-development-secret-change-me-2026}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT1H}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006,http://localhost:3000,http://localhost:8088}
      # 원격 디버거(IDE)가 5005 로 붙을 수 있게 bootRun JVM 에 JDWP 를 붙인다.
      BOOT_RUN_JVM_ARGS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${BACKEND_DEBUG_PORT:-5005}:5005"
    volumes:
      - ./backend:/workspace/backend
      # 호스트(macOS, 다른 JDK)의 빌드 산출물과 섞이지 않도록 컨테이너 전용 볼륨을 덮어쓴다.
      - backend-build:/workspace/backend/build
      - backend-project-gradle:/workspace/backend/.gradle
      - backend-gradle-home:/home/dev/.gradle
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    image: terrabyte/frontend-dev
    container_name: terrabyte-frontend
    depends_on:
      - backend
    environment:
      TZ: ${TZ:-Asia/Seoul}
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://localhost:8080}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
      EXPO_NO_TELEMETRY: "1"
      # 컨테이너에는 브라우저가 없다. 지정하지 않으면 Expo 가 xdg-open 을 실행하려다
      # ENOENT 로 죽는다(재시작 루프).
      BROWSER: "none"
      # 컨테이너 bind mount 에서 파일 변경 감지가 누락되는 것을 막는다.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-8081}:8081"
    volumes:
      - ./frontend/app:/workspace/app
      # 호스트의 macOS용 네이티브 모듈이 컨테이너로 들어오지 않도록 분리한다.
      - frontend-node-modules:/workspace/app/node_modules
    command: ["npx", "expo", "start", "--web", "--port", "8081"]
    stdin_open: true
    tty: true
    restart: unless-stopped

  storybook:
    profiles: ["storybook"]
    image: terrabyte/frontend-dev
    build:
      context: ./frontend/app
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    container_name: terrabyte-storybook
    environment:
      TZ: ${TZ:-Asia/Seoul}
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${STORYBOOK_PORT:-6006}:6006"
    volumes:
      - ./frontend/app:/workspace/app
      - frontend-node-modules:/workspace/app/node_modules
    command: ["npm", "run", "storybook", "--", "--host", "0.0.0.0", "--no-open"]
    stdin_open: true
    tty: true

volumes:
  postgres-data:
  influxdb-data:
  influxdb-config:
  mosquitto-data:
  mosquitto-log:
  mosquitto-runtime-config:
  backend-build:
  backend-project-gradle:
  backend-gradle-home:
  frontend-node-modules:
