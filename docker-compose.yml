# TerraByte 개발용 Docker Compose 스택
#
#   docker compose up          # PostgreSQL + InfluxDB + Spring 백엔드 + Expo 프론트엔드
#   docker compose --profile storybook up storybook
#
# 자세한 사용법은 docs/docker_dev_environment.md 를 참고하세요.
name: terrabyte

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: terrabyte-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terrabyte}
      POSTGRES_USER: ${POSTGRES_USER:-terrabyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrabyte}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-terrabyte}" -d "${POSTGRES_DB:-terrabyte}"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  influxdb:
    image: ${INFLUXDB_IMAGE:-influxdb:2.7}
    container_name: terrabyte-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-terrabyte}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-terrabyte-admin-password}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-terrabyte}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-terrabyte-local-token}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${INFLUX_PORT:-8086}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: terrabyte-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - ./infra/mosquitto/passwd:/mosquitto/config/passwd:ro
      # retained 메시지(특히 up/status 온라인 상태)와 로그가 재시작 후에도 남아야
      # 백엔드가 게이트웨이 프레즌스를 다시 계산하지 않아도 된다.
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      # 컨테이너가 떠 있는지가 아니라 브로커가 실제로 응답하는지 확인한다:
      # mosquitto_sub 로 1초간 구독을 시도해 접속·인증 경로가 살아있음을 증명한다.
      test:
        - CMD-SHELL
        - mosquitto_sub -h localhost -p 1883 -u terrabyte-backend -P "${MQTT_PASSWORD:-terrabyte-backend-local}" -t '$$SYS/#' -C 1 -W 3 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      args:
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:21-jdk-jammy}
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    image: terrabyte/backend-dev
    container_name: terrabyte-backend
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        # 백엔드는 기동 시점에 Influx 가 필요하지 않으므로 healthy 까지 기다리지 않는다.
        condition: service_started
      mosquitto:
        # MQTT 연결 없이는 게이트웨이 텔레메트리를 받을 수 없으므로 healthy 를 기다린다.
        condition: service_healthy
      ai-server:
        # service_healthy 로 걸면 안 된다. AI 가 죽어도 백엔드는 엣지 수식과
        # 폴백표로 관수량을 정해야 하며, healthy 를 기다리면 AI 장애가 그대로
        # 백엔드 장애가 된다.
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SERVER_PORT: "8080"
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-terrabyte}
      POSTGRES_USER: ${POSTGRES_USER:-terrabyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrabyte}
      SQLITE_URL: jdbc:sqlite:/workspace/backend/db/terrabyte-score.db
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:-terrabyte-local-token}
      INFLUX_ORG: ${INFLUX_ORG:-terrabyte}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telemetry}
      TELEMETRY_DEVICE_KEY: ${TELEMETRY_DEVICE_KEY:-terrabyte-local-device-key}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_URL: ${MQTT_URL:-tcp://mosquitto:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-terrabyte-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-terrabyte-backend-local}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-tb/v2}
      # 이 스위치가 켜져야 백엔드가 승인한 관수를 실제로 발행한다. 꺼져 있으면
      # LoggingCommandDispatcher 가 경고만 남기고 명령은 TTL 로 만료된다.
      MQTT_COMMAND_DISPATCH_ENABLED: ${MQTT_COMMAND_DISPATCH_ENABLED:-false}
      # 스택에 AI 서버가 함께 뜨므로 개발 환경에서는 켠다. 애플리케이션 기본값은
      # 여전히 false 이므로, 컨테이너 없이 백엔드만 띄우면 호출 자체가 없다.
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai-server:8000}
      AI_API_KEY: ${AI_API_KEY:-}
      # 룰 엔진. 임계값을 밖에서 조절할 수 없으면 시연 중에 관수를 유도하려고
      # 이미지를 다시 빌드해야 한다. 기본값은 모두 코드와 같다.
      RULE_INTERVAL_MS: ${RULE_INTERVAL_MS:-60000}
      # 이 값 아래로 내려가면 Governor 에게 물을 요청한다. 요청일 뿐이며
      # 간격·예산·용량은 여전히 Governor 가 판단한다.
      RULE_SOIL_DRY_GATE_PCT: ${RULE_SOIL_DRY_GATE_PCT:-35.0}
      # 조명이 켜질 수 있는 시간대. 밖에서는 램프가 무조건 꺼진다.
      RULE_PHOTOPERIOD_START: ${RULE_PHOTOPERIOD_START:-06:00}
      RULE_PHOTOPERIOD_END: ${RULE_PHOTOPERIOD_END:-22:00}
      JWT_ISSUER: ${JWT_ISSUER:-terrabyte-backend}
      JWT_SECRET: ${JWT_SECRET:-terrabyte-local-development-secret-change-me-2026}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT1H}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-terrabyte-local-admin-key-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006,http://localhost:3000,http://localhost:8088}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      NOTIFICATION_SENSOR_REMINDER_INTERVAL: ${NOTIFICATION_SENSOR_REMINDER_INTERVAL:-PT1H}
      NOTIFICATION_OFFLINE_REMINDER_INTERVAL: ${NOTIFICATION_OFFLINE_REMINDER_INTERVAL:-PT6H}
      NOTIFICATION_DELIVERY_POLL_DELAY_MS: ${NOTIFICATION_DELIVERY_POLL_DELAY_MS:-5000}
      NOTIFICATION_DELIVERY_BATCH_SIZE: ${NOTIFICATION_DELIVERY_BATCH_SIZE:-50}
      NOTIFICATION_DELIVERY_MAX_ATTEMPTS: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:-5}
      NOTIFICATION_DELIVERY_RETRY_INTERVAL: ${NOTIFICATION_DELIVERY_RETRY_INTERVAL:-PT30S}
      NOTIFICATION_DELIVERY_CLAIM_TIMEOUT: ${NOTIFICATION_DELIVERY_CLAIM_TIMEOUT:-PT5M}
      TOSS_PAYMENTS_ENABLED: ${TOSS_PAYMENTS_ENABLED:-false}
      TOSS_PAYMENTS_CLIENT_KEY: ${TOSS_PAYMENTS_CLIENT_KEY:-}
      TOSS_PAYMENTS_SECRET_KEY: ${TOSS_PAYMENTS_SECRET_KEY:-}
      TOSS_PAYMENTS_SUCCESS_URL: ${TOSS_PAYMENTS_SUCCESS_URL:-http://localhost:8081/payment/success}
      TOSS_PAYMENTS_FAIL_URL: ${TOSS_PAYMENTS_FAIL_URL:-http://localhost:8081/payment/fail}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_CACHE_TTL: ${GEMINI_CACHE_TTL:-PT30M}
      # 원격 디버거(IDE)가 5005 로 붙을 수 있게 bootRun JVM 에 JDWP 를 붙인다.
      BOOT_RUN_JVM_ARGS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${BACKEND_DEBUG_PORT:-5005}:5005"
    volumes:
      - ./backend:/workspace/backend
      # 호스트(macOS, 다른 JDK)의 빌드 산출물과 섞이지 않도록 컨테이너 전용 볼륨을 덮어쓴다.
      - backend-build:/workspace/backend/build
      - backend-project-gradle:/workspace/backend/.gradle
      - backend-gradle-home:/home/dev/.gradle
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile.dev
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    image: terrabyte/ai-server-dev
    container_name: terrabyte-ai-server
    environment:
      TZ: ${TZ:-Asia/Seoul}
      # 모델 교체·롤백은 이 경로만 바꾸고 재시작한다. 코드 변경은 없다.
      AI_MODEL_PATH: ${AI_MODEL_PATH:-/workspace/ai-server/models/irrigation_reg_v1.joblib}
      # 비워 두면 무인증이다. 개발 스택은 내부 네트워크 전용이라 기본값이 없다.
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "${AI_SERVER_PORT:-8000}:8000"
    volumes:
      - ./ai-server:/workspace/ai-server
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    image: terrabyte/frontend-dev
    container_name: terrabyte-frontend
    depends_on:
      - backend
    environment:
      TZ: ${TZ:-Asia/Seoul}
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://localhost:8080}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
      EXPO_NO_TELEMETRY: "1"
      # 컨테이너에는 브라우저가 없다. 지정하지 않으면 Expo 가 xdg-open 을 실행하려다
      # ENOENT 로 죽는다(재시작 루프).
      BROWSER: "none"
      # 컨테이너 bind mount 에서 파일 변경 감지가 누락되는 것을 막는다.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-8081}:8081"
    volumes:
      - ./frontend/app:/workspace/app
      # 호스트의 macOS용 네이티브 모듈이 컨테이너로 들어오지 않도록 분리한다.
      - frontend-node-modules:/workspace/app/node_modules
    command: ["npx", "expo", "start", "--web", "--port", "8081"]
    stdin_open: true
    tty: true
    restart: unless-stopped

  storybook:
    profiles: ["storybook"]
    image: terrabyte/frontend-dev
    build:
      context: ./frontend/app
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    container_name: terrabyte-storybook
    environment:
      TZ: ${TZ:-Asia/Seoul}
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${STORYBOOK_PORT:-6006}:6006"
    volumes:
      - ./frontend/app:/workspace/app
      - frontend-node-modules:/workspace/app/node_modules
    command: ["npm", "run", "storybook", "--", "--host", "0.0.0.0", "--no-open"]
    stdin_open: true
    tty: true

volumes:
  postgres-data:
  influxdb-data:
  influxdb-config:
  mosquitto-data:
  mosquitto-log:
  backend-build:
  backend-project-gradle:
  backend-gradle-home:
  frontend-node-modules:
