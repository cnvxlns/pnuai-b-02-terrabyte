# TerraByte 개발용 Mosquitto 설정
#
# 게이트웨이(Orange Pi)와 백엔드가 HTTP 대신 MQTT로 통신하기 위한 브로커 설정이다.
# 자세한 배경은 docs/design/device_model_and_telemetry_contract.md §6.3, §6.4 참고.

# 컨테이너 내부 기본 리스너. 도커 네트워크 안에서는 "mosquitto:1883", 호스트에서는
# 이 컴포즈 파일이 매핑한 포트로 접근한다.
listener 1883

# TLS(8883) 리스너 — 인증서가 있을 때만 켜진다. mosquitto 자체는 "파일이 없으면
# 이 리스너를 건너뛴다" 같은 조건부 설정을 지원하지 않으므로, TLS 리스너 정의는
# 이 파일에 직접 적지 않고 별도 conf.d 조각 파일로 분리했다. docker-entrypoint.sh
# 가 컨테이너 기동 시 infra/mosquitto/certs/ 아래 인증서 존재 여부를 확인해서
# conf.d/tls.conf 를 넣거나 지운다 — 인증서가 없으면 이 include_dir 는 빈
# 디렉터리를 가리키고 mosquitto는 1883 평문 리스너만으로 정상 기동한다.
# 자세한 설명: infra/mosquitto/tls.conf.template, infra/mosquitto/docker-entrypoint.sh,
# infra/mosquitto/README.md "TLS(8883) 사용법" 참고.
include_dir /mosquitto/config/runtime/conf.d

# 익명 접속을 허용하면 ACL이 무의미해진다 — 반드시 비활성화한다.
allow_anonymous false

# 사용자별 자격 증명 (해시된 패스워드 파일).
#
# 원본은 ./passwd 로 저장소에 커밋돼 있지만, 여기서는 그 원본을 직접 가리키지
# 않는다. 원본은 docker-compose.yml 에서 :ro 로 바인드 마운트되므로 컨테이너
# 안에서 chmod로 권한을 좁힐 수 없고(Read-only file system), git도 실행 비트
# 외의 권한 비트를 추적하지 않아 clone 시점 권한이 항상 0600이라는 보장이 없다.
# 그래서 docker-entrypoint.sh 가 기동 시 원본을 이 런타임 경로로 복사하면서
# 0600으로 좁힌다 — mosquitto 2.x는 world-readable passwd/aclfile에 경고를
# 내고 향후 버전에서는 로드 자체를 거부할 예정이라 반드시 필요하다.
password_file /mosquitto/config/runtime/passwd

# 토픽별 write/read 권한 — 게이트웨이가 자신의 gatewayId 바깥 토픽을 위조하지 못하게 막는다.
# password_file과 같은 이유로 런타임 복사본을 가리킨다 (권한 좁히기 목적).
acl_file /mosquitto/config/runtime/aclfile

# 영속화: 재시작 후에도 retained 메시지(특히 up/status 의 온라인 상태)와
# 세션이 유지되어야 백엔드가 게이트웨이 프레즌스를 다시 계산하지 않아도 된다.
persistence true
persistence_location /mosquitto/data/

# 접속/구독 로그. 데모 단계 트러블슈팅용이며 운영에서는 별도로 조정한다.
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# websocket 리스너는 이 프로젝트에서 쓰지 않으므로 열지 않는다(공격 표면 최소화).
